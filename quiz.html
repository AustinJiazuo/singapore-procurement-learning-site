<script type="application/json" id="quiz-data">[{"id":"overview-0","module":"overview","moduleLabel":"行业概览","question":"为什么大量跨国公司选择把区域采购中心（Regional Procurement Hub）设在新加坡？","options":["因为新加坡的劳动力成本在亚洲最低","因为它是全球贸易与转口枢纽，MNC 普遍在此设区域总部统筹亚太寻源","因为新加坡政府规定外资企业必须在本地完成采购","因为新加坡拥有丰富的自然资源和原材料供应"],"answer":1,"explanation":"新加坡的优势在于枢纽区位、贸易网络、法治与商业环境，而非低成本或自然资源；MNC 因此把统筹亚太采购的职能放在这里。"},{"id":"overview-1","module":"overview","moduleLabel":"行业概览","question":"下列哪项属于间接采购（Indirect Procurement）？","options":["半导体厂采购晶圆","制药厂采购原料药","汽车零部件厂采购钢材","公司为员工采购差旅服务与办公电脑"],"answer":3,"explanation":"间接采购的对象是支持企业运营、但不进入最终产品的商品与服务；晶圆、原料药、钢材都会进入产品，属于直接采购。"},{"id":"overview-2","module":"overview","moduleLabel":"行业概览","question":"「战略寻源（Strategic Sourcing）」的核心工作是什么？","options":["分析支出与供应市场，评估选择供应商并谈判签约","跟踪采购订单、收货对账并安排付款","安排仓储与运输，把货物按时送达客户","制定生产计划并设定库存水位"],"answer":0,"explanation":"寻源对应 Source-to-Contract（S2C）流程，解决「跟谁买、以什么条件买」；下单到付款属于 P2P 执行，物流与计划则属于供应链其他环节。"},{"id":"overview-3","module":"overview","moduleLabel":"行业概览","question":"新加坡政府采购的三大原则是？","options":["最低价中标、快速交付、本地优先","保密、效率、集中管理","透明、公开公平竞争、物有所值","环保、创新、数字化"],"answer":2,"explanation":"新加坡政府采购的三大原则是透明（Transparency）、公开公平竞争（Open and Fair Competition）与物有所值（Value for Money）——注意「物有所值」不等于「最低价中标」。"},{"id":"overview-4","module":"overview","moduleLabel":"行业概览","question":"GeBIZ 是什么？","options":["新加坡政府的电子采购门户，政府招标与询价在此统一发布","SIPMM 推出的在线课程学习平台","企业发展局管理的企业补贴申请系统","一家面向东南亚的私营 B2B 电商平台"],"answer":0,"explanation":"GeBIZ 是新加坡政府的电子采购门户，公共部门的询价与招标统一在此发布、投标与授标，供应商需注册后方可参与。"},{"id":"overview-5","module":"overview","moduleLabel":"行业概览","question":"负责制定新加坡政府采购政策与规则的机构是？","options":["企业发展局（Enterprise Singapore）","经济发展局（EDB）","新加坡采购与物料管理学院（SIPMM）","财政部（MOF）"],"answer":3,"explanation":"政府采购政策由财政部（MOF）主管制定；EnterpriseSG 与 EDB 的职能分别是企业发展和招商引资，SIPMM 是专业培训机构而非政府部门。"},{"id":"overview-6","module":"overview","moduleLabel":"行业概览","question":"关于 SIPMM 与 CIPS，下列说法正确的是？","options":["两者都是新加坡政府设立的采购监管机构","SIPMM 是本地专业学院，CIPS 是源自英国的全球性采购专业机构","CIPS 的认证只在新加坡境内有效","SIPMM 只提供物流课程，不涉及采购内容"],"answer":1,"explanation":"SIPMM 是 1972 年成立的本地专业学院，CIPS 则是源自英国、全球通行的采购专业机构（MCIPS 资格国际认可）；两者都是培训认证组织，不是监管机构。"},{"id":"overview-7","module":"overview","moduleLabel":"行业概览","question":"企业推行「中国+1（China Plus One）」的供应商布局策略，反映的是哪种行业趋势？","options":["数字化转型与电子采购","可持续采购与 ESG","供应链韧性与多元化布局","支出数据分析"],"answer":2,"explanation":"「中国+1」指在中国之外增加至少一个供应来源地以分散风险，属于疫情与地缘政治风险后兴起的供应链韧性（Resilience）策略。"},{"id":"government-0","module":"government","moduleLabel":"政府采购","question":"下列哪一项不属于新加坡政府采购的三大原则？","options":["公开透明（Transparency）","物有所值（Value for Money）","本地供应商优先（Local Preference）","公开公平竞争（Open and Fair Competition）"],"answer":2,"explanation":"新加坡作为 WTO《政府采购协定》缔约方实行非歧视原则，不设本地优先；三大原则是公开透明、公开公平竞争与物有所值。"},{"id":"government-1","module":"government","moduleLabel":"政府采购","question":"一项估算总值为 50,000 新元的服务采购，按通行门槛应采用哪种方式？","options":["小额采购（Small Value Purchase）","报价采购（ITQ）","公开招标（ITT）","限制性招标（Limited Tender）"],"answer":1,"explanation":"通行门槛下，超过 6,000 至 90,000 新元的采购适用报价采购（ITQ）；超过 90,000 新元才须走招标程序。"},{"id":"government-2","module":"government","moduleLabel":"政府采购","question":"关于 GeBIZ，下列说法正确的是？","options":["只有新加坡本地企业才能注册投标","浏览在招商机必须先付费注册账户","它是政府发布商机、供应商在线投标的一站式电子门户","它只发布招标（ITT），报价采购（ITQ）走线下渠道"],"answer":2,"explanation":"GeBIZ 是政府采购的统一电子门户，ITQ 和 ITT 都在其上发布；浏览商机无需登录，海外供应商也有注册通道。"},{"id":"government-3","module":"government","moduleLabel":"政府采购","question":"在哪种情形下，采购机构才可以使用限制性招标（Limited Tender）？","options":["为了缩短流程、赶预算截止日期","存在独家供应来源或极端紧急等法定例外情形","采购金额低于 90,000 新元","上一次的中标供应商表现良好，想直接续用"],"answer":1,"explanation":"限制性招标是严格受限的例外，只能在独家来源、极端紧急、国家安全或此前公开招标无合规响应等法定情形下使用，且须说明理由并经审批。"},{"id":"government-4","module":"government","moduleLabel":"政府采购","question":"双信封制（Two-envelope System）的核心做法是？","options":["质量与价格建议书分开提交，先评质量，达标者才开价格信封","每家供应商可以提交两份不同价格的报价","评标委员会分成两组分别独立打分","中标结果装入两个信封分别通知供应商"],"answer":0,"explanation":"双信封制把质量与价格分开密封，先评质量、后开价格，避免评委被低价先入为主，常用于咨询、设计等智力密集型采购。"},{"id":"government-5","module":"government","moduleLabel":"政府采购","question":"对「物有所值」（Value for Money）原则，理解正确的是？","options":["永远选择报价最低的供应商","综合价格、质量与全生命周期成本后的最优选择","只看质量方案，价格无关紧要","优先照顾长期合作的老供应商"],"answer":1,"explanation":"物有所值不等于最低价，而是价格与质量、交付能力、生命周期成本综合权衡后的最优结果，这也是 PQM 评价方法的逻辑。"},{"id":"government-6","module":"government","moduleLabel":"政府采购","question":"供应商在 GeBIZ 投标截止时间后 10 分钟才完成上传，通常的结果是？","options":["可以向采购机构申请补交","扣减部分质量分后照常参与评审","系统拒收，本次投标失败","自动顺延到下一轮报价"],"answer":2,"explanation":"GeBIZ 到截止时间即关闭通道，迟标不被接收，也没有补交机制，所以务必提前提交并预留上传时间。"},{"id":"government-7","module":"government","moduleLabel":"政府采购","question":"几家供应商私下约定轮流中标、互相陪标，可能面临的后果是？","options":["只要最终没有成交就不算违法","违反《竞争法》被处罚款，并可能被除名禁标","仅会收到采购机构的口头警告","只需退还已中标的合同即可"],"answer":1,"explanation":"围标属《竞争法》禁止的反竞争行为，由 CCCS 执法可处高额罚款；同时可被除名常设委员会禁标，情节严重的还涉及刑责。"},{"id":"process-0","module":"process","moduleLabel":"采购实务","question":"下列哪项工作属于 P2P（Procure-to-Pay）阶段，而不是 S2C（Source-to-Contract）阶段？","options":["制定加权评分矩阵评估供应商","与供应商谈判付款条件","对 PO、收货单和发票做三单匹配","撰写 RFP 并组织方案评审"],"answer":2,"explanation":"三单匹配发生在收货与付款环节，属于执行性的 P2P 段；其余三项都是签约之前的 S2C 策略性工作。"},{"id":"process-1","module":"process","moduleLabel":"采购实务","question":"公司希望供应商发挥自身技术优势提出更优实现方案，规格说明书应优先采用哪种写法？","options":["技术规格：附详细图纸和材料牌号","功能规格：描述需要达到的性能与结果","直接指定某品牌型号以保证质量","不写规格，请供应商自由发挥"],"answer":1,"explanation":"功能规格只约定要达到的结果，把实现路径留给供应商，最能激发创新；技术规格和指定品牌都会收窄方案空间，完全不写规格则无法比价和验收。"},{"id":"process-2","module":"process","moduleLabel":"采购实务","question":"采购一批规格完全标准化的紧固件，需求明确、主要比价格，应发出哪种寻源文件？","options":["RFI（信息征询）","RFP（方案征询）","RFQ（询价）","EOI（意向征集）"],"answer":2,"explanation":"RFQ 适用于规格明确、以价格为主要比较维度的采购；RFI 用于摸底市场，RFP 用于比方案。"},{"id":"process-3","module":"process","moduleLabel":"采购实务","question":"设备 A 报价 8 万新元但能耗高、维护贵；设备 B 报价 10 万新元但十年综合费用更低。选择设备 B 体现了什么思维？","options":["最低价中标","总拥有成本（TCO）","准时制（JIT）","供应商关系管理（SRM）"],"answer":1,"explanation":"TCO 把采购价、能耗、维护、停机、处置等全生命周期成本一起计算，购买价低不等于总成本低。"},{"id":"process-4","module":"process","moduleLabel":"采购实务","question":"谈判术语 BATNA 指的是什么？","options":["双方底线之间的可成交区间","谈判破裂时你手上的最佳替代方案","买方能接受的最高价格","供应商的成本拆分结构"],"answer":1,"explanation":"BATNA 是 Best Alternative to a Negotiated Agreement——谈不成时的最优出路，例如第二名供应商的报价；双方底线间的重叠区间是 ZOPA。"},{"id":"process-5","module":"process","moduleLabel":"采购实务","question":"标准的三单匹配（3-Way Match）核对的是哪三份单据？","options":["采购申请、采购订单、合同","采购订单、收货单、发票","报价单、发票、付款凭证","送货单、质检报告、发票"],"answer":1,"explanation":"三单匹配用 PO（订了什么）、GRN（实际收到什么）、发票（要付多少）互相印证，三者一致才放行付款。"},{"id":"process-6","module":"process","moduleLabel":"采购实务","question":"关于新加坡的 InvoiceNow，下列说法正确的是？","options":["它是 IRAS 开发的企业报税软件","它是基于国际 Peppol 标准、由 IMDA 推动的全国电子发票网络","它只允许政府机构之间相互使用","它要求所有发票打印盖章后邮寄"],"answer":1,"explanation":"InvoiceNow 让发票以结构化数据在买卖双方财务系统间直连传输，由 IMDA 推动、基于 Peppol 标准，企业间和企业对政府的交易都可使用。"},{"id":"process-7","module":"process","moduleLabel":"采购实务","question":"按 Kraljic 矩阵，采购金额大但供应风险低、可选供应商众多的品类属于哪一类？应采取什么策略？","options":["战略品类——建立长期伙伴关系","瓶颈品类——增加安全库存保供","杠杆品类——集中采购量竞标压价","常规品类——流程自动化"],"answer":2,"explanation":"高支出、低风险即杠杆品类，买方议价能力强，最有效的策略是汇总需求量、引入充分竞争来压价。"},{"id":"legal-0","module":"legal","moduleLabel":"法律合规","question":"下列哪项不是新加坡法律下商业合同成立的必要要素？","options":["要约与承诺","对价（Consideration）","书面形式并加盖公司印章","设立法律关系的意图"],"answer":2,"explanation":"普通法下多数商业合同无需书面形式，口头或邮件往来也可成立合同；必要要素是要约、承诺、对价与设立法律关系的意图。"},{"id":"legal-1","module":"legal","moduleLabel":"法律合规","question":"政府机构在 GeBIZ 上发布招标公告，其法律性质通常是？","options":["要约（Offer）","要约邀请（Invitation to Treat）","承诺（Acceptance）","已成立的合同"],"answer":1,"explanation":"招标公告一般只是邀请供应商来投标的要约邀请；供应商提交的投标书才构成要约，买方接受后合同才成立。"},{"id":"legal-2","module":"legal","moduleLabel":"法律合规","question":"合同约定\"每延迟一周扣合同价0.5%\"的预定违约金（LD）条款，要获得法院执行，关键在于它？","options":["金额定得越高，越能威慑供应商","是签约时对可能损失的真实预估","已在新加坡海关备案","经供应商书面确认即可"],"answer":1,"explanation":"LD 必须是对损失的真实预估（genuine pre-estimate）；若被认定为惩罚性条款（Penalty），法院可能拒绝执行。"},{"id":"legal-3","module":"legal","moduleLabel":"法律合规","question":"供应商因疫情无法交货，但合同中没有不可抗力条款，供应商想免责会面临什么局面？","options":["普通法不默认提供不可抗力保护，只能尝试门槛极高的合同受挫原则","新加坡法律规定疫情一律自动免责","只需向 CCCS 备案即可免责","此前口头提过疫情风险就可以免责"],"answer":0,"explanation":"与成文法体系不同，普通法没有默认的不可抗力概念，不写进合同就不存在；剩下的合同受挫（Frustration）原则适用门槛极高。"},{"id":"legal-4","module":"legal","moduleLabel":"法律合规","question":"你把落标供应商投标文件中的团队成员简历转发给与评标无关的同事传阅，最可能违反 PDPA 的哪项义务？","options":["目的限制与保护义务","数据泄露通报义务","跨境转移限制","保存限制义务"],"answer":0,"explanation":"简历收集的目的是评标，转发给无关人员超出了原目的且缺乏保护措施，主要触及目的限制（Purpose Limitation）与保护义务。"},{"id":"legal-5","module":"legal","moduleLabel":"法律合规","question":"关于新加坡贪污调查局（CPIB），下列说法正确的是？","options":["只调查公务员，不涉及私营企业","隶属新加坡警察部队","直属总理公署，公共与私营部门的贪污都管","只处理涉案金额10万新元以上的案件"],"answer":2,"explanation":"CPIB 直属总理公署以保证独立性；《防止贪污法》同时覆盖公共与私营部门，私企采购员收受好处同样可被追究刑责。"},{"id":"legal-6","module":"legal","moduleLabel":"法律合规","question":"两家供应商私下商定轮流中标并互相陪标，这一行为违反的是？","options":["《货物销售法》——属货物质量问题","《竞争法》第34条——由 CCCS 查处的围标行为","《电子交易法》——电子投标无效","不违法，只是商业道德问题"],"answer":1,"explanation":"轮流中标与陪标是典型的围标/串标，属《竞争法》第34条禁止的核心卡特尔行为，由 CCCS 查处，罚款可达新加坡营业额的10%。"},{"id":"legal-7","module":"legal","moduleLabel":"法律合规","question":"在新加坡，下列哪类进口货物需要缴纳关税？","options":["所有进口货物都要缴关税","电子产品和服装","仅酒类、烟草制品、机动车和石油产品四类","进口货物完全免税，也不缴 GST"],"answer":2,"explanation":"新加坡是自由港，只对四类应税商品（Dutiable Goods）征关税；但注意绝大多数进口货物仍须缴纳 GST（现行9%）。"},{"id":"supplychain-0","module":"supplychain","moduleLabel":"供应链生态","question":"关于大士港（Tuas Port）整合计划，下列说法正确的是？","options":["大士港是新建的航空货站，用于分流樟宜机场的货运量","新加坡计划把现有各集装箱码头业务逐步整合到大士港，全面建成后年处理能力将大幅提升","大士港建成后只处理本地进出口货物，不再承接国际转运","大士港整合计划已于 2022 年全部完成"],"answer":1,"explanation":"大士港自 2022 年起分阶段启用，丹戎巴葛、岌巴、布拉尼、巴西班让等码头将陆续迁入，预计 2040 年代全面建成，届时年处理能力约 6500 万标准箱。"},{"id":"supplychain-1","module":"supplychain","moduleLabel":"供应链生态","question":"一批电子元件从中国运抵新加坡自由贸易区（FTZ）仓库，两周后原样转口到印尼。关于税务处理，正确的是？","options":["抵港时须先缴纳 GST，转口后再申请退税","货物在 FTZ 内存储和转运不产生新加坡关税与 GST，直接转口无需缴税","只要货值低于一定金额就免税，超过则必须缴纳","电子元件属于应税商品，必须存入持牌仓库并缴纳关税"],"answer":1,"explanation":"FTZ 内的货物未进入关税领土，无需缴纳关税与 GST，只有进入本地市场才需申报缴税。新加坡仅对酒类、烟草、石油产品和机动车辆等少数品类征收关税，电子元件不在其列。"},{"id":"supplychain-2","module":"supplychain","moduleLabel":"供应链生态","question":"TradeNet 的核心功能是什么？","options":["政府采购的招投标平台","公司注册与年报申报系统","全国统一的电子报关单一窗口，用于申请进出口与转运许可证","贸易融资与保险的撮合平台"],"answer":2,"explanation":"TradeNet 于 1989 年上线，是全球首个全国性贸易单一窗口，进出口和转运许可证均经由它申请；政府采购用 GeBIZ，公司注册则通过 ACRA 的系统办理。"},{"id":"supplychain-3","module":"supplychain","moduleLabel":"供应链生态","question":"3PL 与 4PL 最主要的区别是？","options":["3PL 只做海运，4PL 只做空运","3PL 提供运输仓储等执行服务，4PL 作为集成商设计并管理整条供应链、协调多家 3PL","4PL 必须是政府背景的机构","3PL 服务国际市场，4PL 只服务本地市场"],"answer":1,"explanation":"3PL 是执行者，通常自有仓库车队；4PL 是轻资产的总集成商，负责方案设计、承运商管理和控制塔运营，两者按角色而非运输方式或市场范围区分。"},{"id":"supplychain-4","module":"supplychain","moduleLabel":"供应链生态","question":"你以 CIF Singapore, Incoterms 2020 从上海采购一批设备，货物在海上运输途中受损。风险由谁承担？","options":["卖方，因为运费和保险都由卖方支付到新加坡","买方，因为风险在上海港货物装上船时已经转移","船公司，须全额赔偿货损","买卖双方各承担一半"],"answer":1,"explanation":"CIF 的风险转移点与 FOB 相同——装运港货物装上船时即转移给买方；卖方只是代付运费并投保最低险别 ICC(C)，买方应凭保险单向保险公司索赔。"},{"id":"supplychain-5","module":"supplychain","moduleLabel":"供应链生态","question":"对整箱集装箱货物，Incoterms 2020 建议用 FCA 取代 FOB 的主要原因是？","options":["FCA 的采购价格总是更便宜","FOB 已在 2020 版中被废除","集装箱通常在码头堆场交给承运人，FCA 使风险转移点与实际交接点一致，而 FOB 要到货物装上船风险才转移","FCA 包含卖方的投保义务，对买方更有保障"],"answer":2,"explanation":"集装箱货交到堆场后、装船前这段时间在 FOB 下风险归属模糊，FCA 让风险随交给承运人即转移，更贴合实际操作；FOB 并未被废除，含投保义务的是 CIF/CIP。"},{"id":"supplychain-6","module":"supplychain","moduleLabel":"供应链生态","question":"企业把面向东南亚六国的库存集中存放在新加坡保税仓，接到各国订单后再分拨发运。这种模式称为？","options":["近岸外包（Nearshoring）","区域配送中心（RDC）","供应商管理库存（VMI）","越库作业（Cross-docking）"],"answer":1,"explanation":"这是典型的区域配送中心（RDC）模式，利用新加坡的航线密度与 FTZ/保税安排集中库存、递延税负；VMI 指供应商管理买方库存，越库指货物不入库直接转运分拨。"},{"id":"supplychain-7","module":"supplychain","moduleLabel":"供应链生态","question":"以下哪项不属于提升供应链韧性的常见做法？","options":["对关键物料建立双源或多源供应","为长交期、高波动物料设置安全库存","把所有订单集中给报价最低的单一供应商，以争取最大折扣","在需求地附近布局近岸产能"],"answer":2,"explanation":"把订单集中到单一供应商虽然可能换来价格折扣，但放大了断供风险，与韧性建设的多元化原则背道而驰；其余三项都是常见的韧性措施。"},{"id":"career-0","module":"career","moduleLabel":"职业与认证","question":"在新加坡采购行业的典型晋升路径中，紧接在「采购经理」之后、通往采购总监之前，最常见的进阶岗位是？","options":["采购助理","品类经理 / 寻源经理","仓库主管","行政经理"],"answer":1,"explanation":"大型企业中品类经理/寻源经理按品类制定区域或全球寻源战略，职责与视野高于单一团队管理，是从经理迈向总监/CPO 的常见台阶。"},{"id":"career-1","module":"career","moduleLabel":"职业与认证","question":"「MCIPS」这一专业资格与下列哪个机构直接相关？","options":["新加坡采购与物料管理学院（SIPMM）","英国皇家采购与供应学会（CIPS）","美国供应管理协会（ISM）","美国供应链管理协会（ASCM）"],"answer":1,"explanation":"MCIPS 是 CIPS 的正式会员资格，通常需完成规定级别课程并具备相应工作经验后申请，是国际采购圈广泛认可的头衔。"},{"id":"career-2","module":"career","moduleLabel":"职业与认证","question":"CPSM（Certified Professional in Supply Management）认证由哪个机构颁发？","options":["美国供应管理协会（ISM）","英国皇家采购与供应学会（CIPS）","新加坡精深技能发展局（SSG）","新加坡采购与物料管理学院（SIPMM）"],"answer":0,"explanation":"CPSM 由美国供应管理协会（ISM）颁发，需通过三门考试并满足学历与工作年限要求，面向有经验的从业者。"},{"id":"career-3","module":"career","moduleLabel":"职业与认证","question":"想系统学习「端到端供应链」并考取对应认证，下列哪个选择最对口？","options":["CPIM","CSCP","CPSM","CIPS Level 2"],"answer":1,"explanation":"CSCP（Certified Supply Chain Professional）由 ASCM/APICS 颁发，覆盖端到端供应链；CPIM 则更侧重生产计划与库存管理。"},{"id":"career-4","module":"career","moduleLabel":"职业与认证","question":"关于 SkillsFuture Credit，下列说法正确的是？","options":["所有在新加坡工作的人都可申领，包括 EP 持有者","仅限 25 岁及以上的新加坡公民使用","只能用于大学学位课程","由雇主统一申请并发放给公司使用"],"answer":1,"explanation":"SkillsFuture Credit 是发放给 25 岁及以上新加坡公民的个人培训额度，持 EP/SP 的外籍人士不适用，需自费或由雇主资助进修。"},{"id":"career-5","module":"career","moduleLabel":"职业与认证","question":"职业转换计划（Career Conversion Programme, CCP）的主要作用是？","options":["为外籍人士办理工作准证","为转行进入新领域的本地中途转业者提供结构化培训，并向雇主提供薪资补贴","向企业提供采购软件采购补贴","对供应商进行资质认证"],"answer":1,"explanation":"CCP 原由劳动力发展局（WSG）管理、2026 年 7 月起归入技能与劳动力发展局（SWDA），帮助中途转业的公民/PR 转入新岗位，政府向录用方雇主提供部分薪资支持，是零基础转入采购的正规通道。"},{"id":"career-6","module":"career","moduleLabel":"职业与认证","question":"在采购岗位的英文简历中，最能打动招聘方的写法是？","options":["详细罗列每天处理的日常事务","用数字量化成果，如年度成本节约比例与管理的采购金额","突出强调自己的期望薪资","附上所有培训课程的完整成绩单"],"answer":1,"explanation":"采购是结果导向的职能，量化的成本节约、年采购额与供应商数量最有说服力；日常事务清单无法体现价值贡献。"},{"id":"career-7","module":"career","moduleLabel":"职业与认证","question":"关于新加坡三类采购雇主的比较，下列哪项描述最准确？","options":["政府与法定机构的采购不受任何规则约束","MNC 区域采购中心通常涉及区域品类管理与国际寻源，工作语言以英语为主","本地中小企业分工极细，采购人员只需负责单一环节","三类雇主的薪酬结构完全相同"],"answer":1,"explanation":"MNC 区域中心以英语为工作语言，负责区域乃至全球品类；政府采购须遵循严格规则并通过 GeBIZ 进行，中小企业则常常一人多岗、全流程都做。"},{"id":"glossary-0","module":"glossary","moduleLabel":"术语表","question":"公司要采购一套定制化的仓库管理系统，需求复杂、无法完全写死规格，希望供应商提出解决方案并按综合评分定标，应发出哪种文件？","options":["询价（RFQ）","建议书征求（RFP）","信息征询（RFI）","采购订单（PO）"],"answer":1,"explanation":"RFP 适用于需求复杂、规格开放的采购，按技术加商务综合评分定标；RFQ 适用于规格明确、以价格为主要决策因素的场景。"},{"id":"glossary-1","module":"glossary","moduleLabel":"术语表","question":"在新加坡政府采购的三级体系中，适用金额最大、程序最严格、须在 GeBIZ 公开发布并公示授标结果的是？","options":["小额采购（SVP）","报价采购（ITQ）","招标采购（ITT）","意向征集（EOI）"],"answer":2,"explanation":"三级体系按金额递增依次为 SVP、ITQ、ITT；ITT 用于超过 90,000 新元的大额采购，评标与授标公示的程序要求最严格。EOI 只是招标前的意向征集，不属于三级体系。"},{"id":"glossary-2","module":"glossary","moduleLabel":"术语表","question":"关于 GeBIZ，下列哪个描述是正确的？","options":["新加坡海关的电子报关平台","新加坡政府采购的统一电子门户","新加坡的企业注册与监管机构","新加坡的全国电子发票网络"],"answer":1,"explanation":"GeBIZ 是政府招标发布、投标与授标公示的统一门户；报关平台是 TradeNet，企业注册机构是 ACRA，电子发票网络是 InvoiceNow。"},{"id":"glossary-3","module":"glossary","moduleLabel":"术语表","question":"按 Incoterms 2020，卖方承担责任最大的贸易术语是？","options":["EXW（工厂交货）","FOB（船上交货）","CIF（成本加保险费加运费）","DDP（完税后交货）"],"answer":3,"explanation":"DDP 由卖方负责运输、保险与进口清关直至买方指定地点，责任最大；EXW 正好相反，几乎所有责任都在买方。"},{"id":"glossary-4","module":"glossary","moduleLabel":"术语表","question":"供应商绩效指标 OTIF 衡量的是什么？","options":["库存周转的速度","供应商报价的响应速度","订单准时且足量交付的比例","发票按时支付的比例"],"answer":2,"explanation":"OTIF 即 On-Time In-Full，要求订单既准时（On-Time）又足量（In-Full）才算达标，是衡量交付可靠性的黄金指标。"},{"id":"glossary-5","module":"glossary","moduleLabel":"术语表","question":"合同中约定「每延迟交付一日，按合同价 0.5% 扣款」，这一条款属于？","options":["履约保证金（Performance Bond）","违约赔偿金（Liquidated Damages, LD）","早付折扣（Early Payment Discount）","变更单（Variation Order）"],"answer":1,"explanation":"LD 是双方在合同中预先约定的违约赔偿金额；履约保证金是银行或保险公司出具的担保，两者性质不同。"},{"id":"glossary-6","module":"glossary","moduleLabel":"术语表","question":"向新加坡海关申报进出口许可证（permit）使用的系统是？","options":["GeBIZ","NTP（全国贸易平台）","TradeNet","InvoiceNow"],"answer":2,"explanation":"TradeNet 是新加坡海关的电子报关系统，许可证申报经此办理；NTP 是整合贸易单证与增值服务的生态平台，与 TradeNet 功能互补而非替代。"},{"id":"glossary-7","module":"glossary","moduleLabel":"术语表","question":"供应商 A 报出的单价最低，但 MOQ 高、账期短、且需买方自付海运费。判断其真实成本高低，最应采用哪个口径？","options":["直接对比单价","总拥有成本（TCO）与到岸成本（Landed Cost）","对比含 GST 的报价","应然成本分析（Should-cost）"],"answer":1,"explanation":"TCO 与到岸成本把运费、税费、库存与资金占用等全部纳入比较，单价最低不等于成本最低；应然成本是测算合理价格的工具，不是比价口径。"}]</script>
